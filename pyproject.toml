[project]
name = "pm-jobs"
version = "0.1.0"
description = "Personal job scanner for a product manager: scrape, dedupe, rank"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-jobspy>=1.1.82",
    "pyyaml>=6.0",
]

[project.scripts]
pm-jobs = "pm_jobs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pm_jobs"]
