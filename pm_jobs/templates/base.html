<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ view }} · pm-jobs</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --ink: #1c1b19; --muted: #6b6862;
    --line: #e6e2dc; --accent: #1b6b5a; --star: #c9820a;
    --tag-bg: #eef2f0; --tag-ink: #2c5c50;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2124; --ink: #e9e7e3; --muted: #9a968f;
      --line: #2e3135; --accent: #6fd3b6; --star: #e5aa3c;
      --tag-bg: #26332f; --tag-ink: #8fd8c2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 14px 20px; display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  nav { display: flex; gap: 14px; }
  nav a { color: var(--muted); text-decoration: none; font-size: 15px; padding-bottom: 2px; }
  nav a.on { color: var(--ink); font-weight: 600; border-bottom: 2px solid var(--accent); }
  nav .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { max-width: 820px; margin: 0 auto; padding: 20px; }
  .job {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 12px;
  }
  .job h2 { font-size: 17px; margin: 0 0 4px; line-height: 1.35; }
  .job h2 a { color: var(--ink); text-decoration: none; }
  .job h2 a:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .summary { margin: 0 0 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg); color: var(--tag-ink); border-radius: 20px;
    padding: 2px 11px; font-size: 13px; font-weight: 600;
  }
  .sources { color: var(--muted); font-size: 13px; }
  .sources a { color: var(--muted); }
  form { margin: 0; margin-left: auto; }
  button {
    background: none; border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
    color: var(--muted); font-size: 14px; padding: 4px 11px; font-family: inherit;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.on { color: var(--star); border-color: var(--star); }
  .empty { color: var(--muted); text-align: center; padding: 64px 20px; }
</style>
</head>
<body>
<header>
  <h1>pm-jobs</h1>
  <nav>
    {% for name, count in counts.items() %}
      <a href="{{ url_for('view', view=name) }}" class="{{ 'on' if name == view else '' }}">
        {{ name }} <span class="n">{{ count }}</span>
      </a>
    {% endfor %}
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
